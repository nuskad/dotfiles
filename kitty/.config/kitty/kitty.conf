# Converted from alacritty.toml
# Original had `background = "#282738"` commented out under [colors] — left out here too.

#: Cursor -------------------------------------------------------------

cursor_shape              block
# alacritty: cursor.style.blinking = "On"
cursor_blink_interval     -1
# alacritty: cursor.unfocused_hollow = false
# kitty defaults to a hollow cursor when unfocused; "false" means keep it solid instead
cursor_shape_unfocused    block

shell_integration no-cursor

#: Window ---------------------------------------------------------------

# alacritty: window.decorations = "full"
hide_window_decorations   no

# alacritty: window.dynamic_title = true
# kitty updates the title from shell/OSC sequences automatically; no setting needed

# alacritty: window.opacity = 1
background_opacity        1.0

# alacritty: window.dimensions -> columns/lines (kitty uses cells with a "c" suffix)
remember_window_size  no
initial_window_width      164c
initial_window_height     48c

# alacritty: window.padding x/y = 10
window_padding_width      10

# alacritty: window.startup_mode = "Windowed"
# kitty has no config-file equivalent; this is a launch-time flag:
#   kitty --start-as=normal
# (other values: maximized, minimized, fullscreen)

#: Reload -----------------------------------------------------------------

# alacritty: general.live_config_reload = true
# kitty reloads its config automatically on save; to disable that behavior use:
# reload_config_on_change no

#: Includes ----------------------------------------------------------------
# alacritty: general.import = [".../colors.toml", ".../fonts.toml"]

include colors.conf
include fonts.conf

#: Notes on settings with no Kitty equivalent -------------------------------
# [env] TERM = "xterm-256color"          -> kitty sets TERM=xterm-kitty itself; don't override
#                                            unless you have a specific compatibility need, in
#                                            which case use: env TERM=xterm-256color
# [env] WINIT_X11_SCALE_FACTOR = "1.0"   -> winit/Alacritty-specific, not applicable to kitty
